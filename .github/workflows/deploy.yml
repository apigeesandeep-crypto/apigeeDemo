name: Deploy Apigee Proxy

on:
  push:
    branches: [ test ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Proxy Name
        run: |
          echo "PROXY_NAME=hello-world" >> $GITHUB_ENV

      # MOVED AUTHENTICATION AND SETUP TO THE TOP
      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/172484352684/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'apigee-github-deployer@project-231b329b-a80c-4f8d-828.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      # Bundle the proxy files
      - name: Bundle API Proxy
        run: |
          cd apiproxy && zip -r ../apiproxy.zip . && cd ..

      # Import the API Proxy (Must happen after setup-gcloud and auth)
      - name: Import API Proxy
        run: |
          gcloud apigee apis import \
            --name=${{ env.PROXY_NAME }} \
            --source=apiproxy.zip \
            --project=project-231b329b-a80c-4f8d-828

      # Deploy the API Proxy
      - name: Deploy to Apigee
        run: |
          gcloud apigee apis deploy \
            --api=${{ env.PROXY_NAME }} \
            --environment=eval \
            --override \
            --project=project-231b329b-a80c-4f8d-828
