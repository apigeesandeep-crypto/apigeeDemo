name: Deploy Apigee API Proxy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROXY_NAME: hello-world
  PROJECT_ID: project-231b329b-a80c-4f8d-828

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Install Apigee CLI
        run: |
          gcloud components install apigee-management

      - name: Create ZIP package
        run: |
          cd apiproxy
          zip -r ../apiproxy.zip .
          cd ..

      - name: Upload API Proxy
        run: |
          gcloud apigee apis create \
            --name=${{ env.PROXY_NAME }} \
            --project=${{ env.PROJECT_ID }} || true

      - name: Create Proxy Revision
        run: |
          gcloud apigee apis versions upload 1 \
            --source=apiproxy.zip \
            --api=${{ env.PROXY_NAME }} \
            --project=${{ env.PROJECT_ID }}

      - name: Deploy Proxy
        run: |
          gcloud apigee envs deployments create \
            --api=${{ env.PROXY_NAME }} \
            --environment=prod \
            --revision=1 \
            --project=${{ env.PROJECT_ID }}