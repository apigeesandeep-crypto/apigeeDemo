name: Deploy Apigee Proxy

on:
  push:
    branches: [ test ] # Triggers when you push to the test branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # This logic sets the proxy name to "my-proxy-test" for the test branch
      - name: Set Proxy Name
        run: |
          echo "PROXY_NAME=hello-world" >> $GITHUB_ENV

       # Bundle the proxy files into a zip (Requirement for import)
      - name: Bundle API Proxy
        run: |
          cd apiproxy && zip -r ../apiproxy.zip . && cd ..

      # Import the API Proxy to Apigee (Creates the resource if it doesn't exist)
      - name: Import API Proxy
        run: |
          gcloud apigee apis import ${{ env.PROXY_NAME }} \
            --source=apiproxy.zip \
            --project=project-231b329b-a80c-4f8d-828

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/172484352684/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'apigee-github-deployer@project-231b329b-a80c-4f8d-828.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Deploy to Apigee
        run: |
          gcloud apigee apis deploy \
            --api=${{ env.PROXY_NAME }} \
            --environment=eval \
            --override \
            --project=project-231b329b-a80c-4f8d-828